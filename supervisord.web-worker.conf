[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord-web-worker.pid
childlogdir=/tmp
minfds=10000

[program:http]
command=frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:queue]
command=php -d memory_limit=%(ENV_QUEUE_MEMORY_LIMIT)s artisan queue:work database_outbox --queue=%(ENV_QUEUE_NAMES)s --sleep=%(ENV_QUEUE_SLEEP)s --backoff=5 --tries=5 --timeout=60 --memory=%(ENV_QUEUE_MEMORY)s --max-jobs=%(ENV_QUEUE_MAX_JOBS)s --max-time=%(ENV_QUEUE_MAX_TIME)s --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20

[program:scheduler]
command=php artisan schedule:work --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=30
