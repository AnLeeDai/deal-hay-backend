services:
  - type: web
    name: deal-hay-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: deal-hay-production
      - key: DEPLOY_ROLE
        value: web
      - key: OCTANE_WORKERS
        value: "1"
      - key: FRANKENPHP_NUM_THREADS
        value: "1"
      - key: FRANKENPHP_MAX_THREADS
        value: "2"
      # This Blueprint runs one API instance. Use a shared store if scaling.
      - key: SPEEDTEST_CACHE_STORE
        value: file
      - key: APP_URL
        fromService:
          name: deal-hay-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: REVERB_HOST
        fromService:
          name: deal-hay-reverb
          type: web
          property: host
      - key: REVERB_PORT
        fromService:
          name: deal-hay-reverb
          type: web
          property: port
      - key: REVERB_PUBLIC_HOST
        fromService:
          name: deal-hay-reverb
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    name: deal-hay-reverb
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /up
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: deal-hay-production
      - key: DEPLOY_ROLE
        value: reverb
      - key: APP_URL
        fromService:
          name: deal-hay-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: REVERB_HOST
        fromService:
          name: deal-hay-reverb
          type: web
          property: host
      - key: REVERB_PORT
        fromService:
          name: deal-hay-reverb
          type: web
          property: port
      - key: REVERB_PUBLIC_HOST
        fromService:
          name: deal-hay-reverb
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: worker
    name: deal-hay-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: deal-hay-production
      - key: DEPLOY_ROLE
        value: worker
      - key: APP_URL
        fromService:
          name: deal-hay-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: REVERB_HOST
        fromService:
          name: deal-hay-reverb
          type: web
          property: host
      - key: REVERB_PORT
        fromService:
          name: deal-hay-reverb
          type: web
          property: port
      - key: REVERB_PUBLIC_HOST
        fromService:
          name: deal-hay-reverb
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

envVarGroups:
  - name: deal-hay-production
    envVars:
      - key: APP_NAME
        value: Deal Hay Backend
      - key: APP_ENV
        value: production
      - key: APP_KEY
      - key: APP_DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://deal-hay.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://deal-hay.vercel.app,https://deal-hay-fontend.vercel.app
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_URL
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: CACHE_STORE
        value: database
      - key: REFERENCE_CACHE_STORE
        value: file
      - key: CACHE_PREFIX
        value: deal-hay-cache
      - key: QUEUE_CONNECTION
        value: database
      - key: QUEUE_NAMES
        value: images,default
      - key: SESSION_DRIVER
        value: database
      - key: MAIL_MAILER
        value: resend
      # Set this to an address on your verified Resend domain in the Dashboard.
      - key: MAIL_FROM_ADDRESS
      - key: MAIL_FROM_NAME
        value: Deal Hay
      # Fill the existing Resend API key in the Dashboard; never commit its value.
      - key: RESEND_API_KEY
      - key: ADMIN_FULL_NAME
      - key: ADMIN_EMAIL
      - key: ADMIN_PHONE_NUMBER
      - key: ADMIN_ADDRESS_DETAIL
      - key: ADMIN_WARD
      - key: ADMIN_PROVINCE
      - key: ADMIN_PASSWORD
      - key: R2_DRIVER
        value: s3
      - key: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET
      - key: R2_ENDPOINT
      - key: R2_URL
      - key: REVERB_APP_ID
        generateValue: true
      - key: REVERB_APP_KEY
        generateValue: true
      - key: REVERB_APP_SECRET
        generateValue: true
      - key: REVERB_ALLOWED_ORIGINS
        value: deal-hay.vercel.app
      - key: REVERB_SCHEME
        value: http
      - key: REVERB_PUBLIC_PORT
        value: "443"
      - key: REVERB_PUBLIC_SCHEME
        value: https
