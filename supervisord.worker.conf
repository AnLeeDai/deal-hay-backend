[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord-worker.pid
childlogdir=/tmp

[program:realtime]
command=php -d memory_limit=128M artisan queue:work database_outbox --queue=%(ENV_DB_OUTBOX_QUEUE)s --sleep=%(ENV_REALTIME_QUEUE_SLEEP)s --backoff=1 --tries=5 --timeout=20 --memory=64 --max-jobs=1000 --max-time=3600 --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=5

[program:queue]
command=php -d memory_limit=%(ENV_QUEUE_MEMORY_LIMIT)s artisan queue:work database_outbox --queue=%(ENV_QUEUE_NAMES)s --sleep=%(ENV_QUEUE_SLEEP)s --backoff=5 --tries=5 --timeout=60 --memory=%(ENV_QUEUE_MEMORY)s --max-jobs=%(ENV_QUEUE_MAX_JOBS)s --max-time=%(ENV_QUEUE_MAX_TIME)s --no-interaction
directory=/app
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10

[program:scheduler]
command=sh /app/docker-scheduler.sh
directory=/app
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20
