[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
minfds=10000

[program:http]
command=frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile
directory=/app
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=75
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=10
